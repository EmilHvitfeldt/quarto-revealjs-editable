[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quarto-revealjs-editable"
version = "0.1.0"
description = "Revision-checked server saving for the Quarto Reveal editable extension"
requires-python = ">=3.11"

[project.scripts]
presentation-edit-server = "presentation_edit_server:main"

[tool.setuptools]
py-modules = ["presentation_edit_server"]
